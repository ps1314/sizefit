<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SizeFit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f4fd1'/><path d='M8 22h16M8 16h11M8 10h6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{--ink:#1d2330;--muted:#5d6675;--line:#e3e6eb;--card:#fff;--bg:#f4f5f7;--soft:#eef0f3;--accent:#1f4fd1;--accent-ink:#fff;--ok:#047857;--warn:#9a3412}
@media (prefers-color-scheme: dark){:root{--ink:#e7e9ee;--muted:#9aa3b2;--line:#2c323d;--card:#171b22;--bg:#0f1217;--soft:#1e232c;--accent:#7f9cff;--accent-ink:#0f1217;--ok:#6ee7b7;--warn:#fdba74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
header.top h1{font-size:22px;margin:0}
header.top p{margin:0;color:var(--muted);flex:1;min-width:200px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center}
.lang button{border:none;border-radius:0;padding:4px 10px;font-size:13px;background:var(--card);color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ok);margin:4px 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.link{border:none;background:none;color:var(--muted);padding:2px 6px}
input[type=file]{display:none}
.samples{margin-top:12px;font-size:13px;color:var(--muted)}
.samples button{font-size:13px;padding:3px 10px}
.file{border-top:1px solid var(--line);padding:12px 0 4px}
.file:first-child{border-top:none;padding-top:0}
.file .name{font-weight:600;word-break:break-all}
.file .fmt{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;background:var(--soft);color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px;margin-top:10px}
.map label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.exportbar{position:sticky;top:0;z-index:2;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.exportbar.show{display:flex}
.exportbar .sp{flex:1}
#report{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
#report:empty{display:none}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.waitlist{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-top:14px}
.waitlist[hidden]{display:none}
.waitlist p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:560px}
.waitlist button{white-space:normal;text-align:left}
.err{color:var(--warn);font-size:13px;margin-top:8px}
@media print{
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .no-print{display:none!important}
  #report{border:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top no-print">
    <h1>SizeFit</h1>
    <p data-i18n="app.tagline"></p>
    <div class="lang" role="group" data-i18n-label="lang.switch">
      <button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>
  <div class="privacy no-print">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span><span data-i18n="app.privacy"></span> <span id="analyticsNote" data-i18n="app.analyticsNote" hidden></span></span>
  </div>

  <section class="panel no-print">
    <h2 data-i18n="app.uploadTitle"></h2>
    <div class="drop" id="drop">
      <p><span data-i18n="app.dropPrompt"></span> <button type="button" class="primary" id="pick" data-i18n="app.pick"></button></p>
      <p style="margin:0;font-size:13px" data-i18n="app.supported"></p>
      <input type="file" id="fileInput" accept=".csv,text/csv" multiple>
    </div>
    <div class="samples"><span data-i18n="app.samplesLabel"></span>
      <button type="button" data-sample="shopify_orders_export.csv" data-i18n="app.sample.orders"></button>
      <button type="button" data-sample="aftership_returns_export.csv" data-i18n="app.sample.aftership"></button>
      <button type="button" data-sample="shopify_orders_export.csv,loop_returns.csv" data-i18n="app.sample.ordersLoop"></button>
      <button type="button" data-sample="dirty_returns.csv" data-i18n="app.sample.dirty"></button>
    </div>
  </section>

  <section class="panel no-print" id="filesPanel" hidden>
    <h2 data-i18n="app.filesTitle"></h2>
    <div id="files"></div>
  </section>

  <section class="panel no-print">
    <h2 data-i18n="app.chartTitle"></h2>
    <div class="row">
      <button type="button" id="pickChart" data-i18n="app.chartUpload"></button>
      <button type="button" class="link" data-sample-chart="size_chart.csv" data-i18n="app.chartSample"></button>
      <span id="chartInfo" class="fmt"></span>
      <input type="file" id="chartInput" accept=".csv,text/csv">
    </div>
    <p class="fmt" style="margin:8px 0 0"><span data-i18n="app.chartHintBefore"></span><code>Product, Size, Chest (cm), Waist (cm) …</code><span data-i18n="app.chartHintAfter"></span></p>
  </section>

  <div class="exportbar no-print" id="exportbar">
    <b data-i18n="app.reportLabel"></b><span class="sp"></span>
    <button type="button" id="dlHtml" data-i18n="app.downloadHtml"></button>
    <button type="button" id="print" data-i18n="app.print"></button>
  </div>
  <div id="report"></div>
  <section class="waitlist no-print" id="waitlist" hidden>
    <div>
      <b data-i18n="app.waitlistTitle"></b>
      <p data-i18n="app.waitlistBody"></p>
    </div>
    <button type="button" class="primary" id="waitlistBtn" data-i18n="app.waitlistButton"></button>
  </section>
  <p class="empty no-print" id="empty" data-i18n="app.empty"></p>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
